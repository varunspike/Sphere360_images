<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>360 Pro Capture</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #camera-view { width: 100%; height: 100%; object-fit: cover; position: absolute; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .ui-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; pointer-events: auto; }
        button { background: rgba(255,255,255,0.2); border: 2px solid #fff; color: #fff; padding: 15px 25px; border-radius: 30px; backdrop-filter: blur(10px); font-weight: bold; }
        #status { position: absolute; top: 20px; width: 100%; text-align: center; color: #0f0; font-family: monospace; text-shadow: 1px 1px 2px #000; }
        .target-dot { position: absolute; width: 40px; height: 40px; border: 3px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); transition: 0.1s linear; }
    </style>
</head>
<body>

<video id="camera-view" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="status">INITIALIZING SENSORS...</div>

<div class="ui-panel">
    <button onclick="startCamera()">START CAMERA</button>
    <button onclick="captureFrame()">CAPTURE MANUALLY</button>
</div>

<script>
    const video = document.getElementById('camera-view');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    let orientation = { alpha: 0, beta: 0, gamma: 0 };
    let capturedFrames = [];

    // 1. Initialize Camera (Targeting Ultra-Wide if possible)
    async function startCamera() {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoDevices = devices.filter(d => d.kind === 'videoinput');
            
            // Look for ultra-wide lens labels
            const backCamera = videoDevices.find(d => d.label.toLowerCase().includes('ultra')) || videoDevices.pop();

            const constraints = {
                video: {
                    deviceId: { exact: backCamera.deviceId },
                    width: { ideal: 4032 },
                    height: { ideal: 3024 }
                }
            };

            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            status.innerText = "ULTRA-WIDE ACTIVE | ROTATE DEVICE";
            requestOrientationPermission();
        } catch (err) {
            status.innerText = "ERROR: " + err.message;
        }
    }

    // 2. Request Gyroscope Access
    function requestOrientationPermission() {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(state => {
                if (state === 'granted') window.addEventListener('deviceorientation', handleMove);
            });
        } else {
            window.addEventListener('deviceorientation', handleMove);
        }
    }

    function handleMove(e) {
        orientation.alpha = e.alpha; // Compass direction
        orientation.beta = e.beta;   // Tilt
        drawUI();
    }

    // 3. Draw the "Photo Sphere" Style UI
    function drawUI() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Center Crosshair
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(canvas.width/2, canvas.height/2, 30, 0, Math.PI*2);
        ctx.stroke();

        // Target "Ghost" Dot (simplified math for tracking)
        const targetX = (canvas.width / 2) + (orientation.alpha % 40) * 5;
        const targetY = (canvas.height / 2) + (orientation.beta % 40) * 5;

        ctx.fillStyle = '#0f0';
        ctx.beginPath();
        ctx.arc(targetX, targetY, 10, 0, Math.PI*2);
        ctx.fill();
    }

    function captureFrame() {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = video.videoWidth;
        tempCanvas.height = video.videoHeight;
        const tCtx = tempCanvas.getContext('2d');
        tCtx.drawImage(video, 0, 0);
        
        capturedFrames.push({
            img: tempCanvas.toDataURL('image/jpeg', 0.95),
            pos: { ...orientation }
        });

        status.innerText = `CAPTURED: ${capturedFrames.length} SAMPLES`;
    }
</script>
</body>
</html>
